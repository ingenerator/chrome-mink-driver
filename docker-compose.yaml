services:

  mink-fixtures:
    # Hosts the HTML / PHP fixture files from the mink testsuite at http://mink-fixtures/
    image: php:${PHP_VERSION:-8.3}-alpine
    volumes:
    - .:/workspace
    working_dir: /workspace/vendor/mink/driver-testsuite/web-fixtures
    entrypoint: php
    command:
      -S 0.0.0.0:80

  chrome:
    image: zenika/alpine-chrome:latest
    command:
    - "--remote-debugging-address=0.0.0.0"
    - "--remote-debugging-port=9222"
    - "--no-sandbox"
    - "--use-gl=swiftshader"
    - "--disable-software-rasterizer"
    - "--disable-dev-shm-usage"
    volumes:
    # Needs to have the workspace mounted for file upload tests (the attachFile command sends Chrome the path
    # to a *local* file to attach to the file input).
    - .:/workspace

  test_runner:
    # Runs the tests
    depends_on:
    - mink-fixtures
    - chrome
    image: php:${PHP_VERSION:-8.3}-alpine
    entrypoint: ash
    environment:
    - CHROME_URL=http://chrome:9222
    - WEB_FIXTURES_HOST=http://mink-fixtures/
    working_dir: /workspace
    volumes:
    - .:/workspace
